<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Key VIP</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body {
            background: #0A1128;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .box {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 2px solid #00FFFF;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        h1 {
            text-align: center;
            color: #00FFFF;
            font-size: 22px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00FFFF;
        }
        h2 { font-size: 18px; color: #00FFFF; margin-bottom: 15px; text-align: center; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1E3A8A;
            border: 1px solid #00FFFF;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        input::placeholder { color: #94a3b8; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-primary { background: #FF00FF; color: white; box-shadow: 0 0 10px #FF00FF; }
        .btn-primary:hover { background: #d400d4; }
        .btn-secondary { background: #1E3A8A; color: white; border: 1px solid #00FFFF; }
        .btn-danger { background: #dc2626; color: white; }
        .msg { text-align: center; font-size: 14px; margin-bottom: 10px; padding: 8px; border-radius: 5px; display: none; }
        .msg-error { background: rgba(220, 38, 38, 0.2); color: #ff6b6b; border: 1px solid #ff6b6b; }
        .msg-success { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid #00ff88; }
        
        .hidden { display: none !important; }
        
        .key-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #1E3A8A;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            background: #020617;
        }
        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #1E3A8A;
            font-size: 13px;
        }
        .key-item:last-child { border-bottom: none; }
        .key-code { color: #00FFFF; font-weight: bold; font-family: monospace; }
        .key-exp { color: #94a3b8; font-size: 11px; }
        .key-badge { background: #FF00FF; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        
        .link-list { margin-bottom: 15px; }
        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border: 1px solid #1E3A8A;
            border-radius: 5px;
            margin-bottom: 5px;
            font-size: 12px;
            word-break: break-all;
        }
        .link-item a { color: #00FFFF; text-decoration: none; }
        .link-item a:hover { text-decoration: underline; }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: #1E3A8A;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab.active { background: #FF00FF; box-shadow: 0 0 8px #FF00FF; }
        
        .welcome-bar {
            text-align: center;
            padding: 10px;
            background: #1E3A8A;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- ============ TRANG NHẬP KEY (USER) ============ -->
<div id="pageKey" class="box">
    <h1>🔑 NHẬP KEY VIP</h1>
    <div id="msgKey" class="msg"></div>
    <input type="text" id="inputKey" placeholder="Nhập Key của bạn..." autocomplete="off">
    <button class="btn btn-primary" onclick="checkKey()">✅ XÁC NHẬN KEY</button>
    <button class="btn btn-secondary" onclick="showAdminLogin()">👑 Đăng nhập Admin</button>
</div>

<!-- ============ TRANG ĐĂNG NHẬP ADMIN ============ -->
<div id="pageAdminLogin" class="box hidden">
    <h1>👑 ĐĂNG NHẬP ADMIN</h1>
    <div id="msgAdminLogin" class="msg"></div>
    <input type="text" id="adminUser" placeholder="Tên đăng nhập..." autocomplete="off">
    <input type="password" id="adminPass" placeholder="Mật khẩu..." autocomplete="off">
    <button class="btn btn-primary" onclick="adminLogin()">🔓 ĐĂNG NHẬP</button>
    <button class="btn btn-secondary" onclick="showKeyPage()">⬅️ Quay lại</button>
</div>

<!-- ============ TRANG ADMIN PANEL ============ -->
<div id="pageAdminPanel" class="box hidden">
    <h1>⚙️ ADMIN PANEL</h1>
    <div class="welcome-bar">Xin chào, <b id="adminName"></b>!</div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('key')" id="tabKey">🔑 Tạo Key</div>
        <div class="tab" onclick="switchTab('link')" id="tabLink">🔗 Thêm Link</div>
        <div class="tab" onclick="switchTab('manage')" id="tabManage">📋 Quản Lý</div>
    </div>

    <!-- TAB TẠO KEY -->
    <div id="tabContentKey">
        <div id="msgCreateKey" class="msg"></div>
        <label style="font-size:13px; color:#94a3b8; display:block; margin-bottom:5px;">Thời hạn Key:</label>
        <select id="keyDuration">
            <option value="1h">1 Giờ</option>
            <option value="10h">10 Giờ</option>
            <option value="1d">1 Ngày</option>
            <option value="3d">3 Ngày</option>
            <option value="7d">7 Ngày</option>
            <option value="30d">30 Ngày</option>
            <option value="60d">60 Ngày</option>
            <option value="365d">365 Ngày</option>
        </select>
        <button class="btn btn-primary" onclick="createKey()">➕ TẠO KEY</button>
    </div>

    <!-- TAB THÊM LINK -->
    <div id="tabContentLink" class="hidden">
        <div id="msgLink" class="msg"></div>
        <input type="text" id="linkName" placeholder="Tên link (VD: Tải App FF)...">
        <input type="text" id="linkUrl" placeholder="Địa chỉ URL (https://...)">
        <button class="btn btn-primary" onclick="addLink()">➕ THÊM LINK</button>
    </div>

    <!-- TAB QUẢN LÝ -->
    <div id="tabContentManage" class="hidden">
        <h2>📋 Danh sách Key</h2>
        <div id="keyList" class="key-list"></div>
        <h2>🔗 Danh sách Link</h2>
        <div id="linkList" class="link-list"></div>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ XÓA TẤT CẢ DỮ LIỆU</button>
    </div>

    <button class="btn btn-secondary" style="margin-top:10px;" onclick="adminLogout()">🚪 ĐĂNG XUẤT</button>
</div>

<!-- ============ TRANG CHÀO MỪNG (SAU KHI NHẬP KEY ĐÚNG) ============ -->
<div id="pageWelcome" class="box hidden">
    <h1>🎉 CHÀO MỪNG VIP!</h1>
    <div id="msgWelcome" class="msg msg-success" style="display:block;">Key hợp lệ! Bạn đã truy cập thành công.</div>
    <div class="welcome-bar">Key của bạn: <b id="activeKey" style="color:#00FFFF;"></b></div>
    <div id="welcomeLinks" class="link-list"></div>
    <button class="btn btn-secondary" onclick="logoutUser()">🚪 THOÁT</button>
</div>

<script>
    // ==========================================
    // 1. CẤU HÌNH ADMIN
    // ==========================================
    const ADMIN_ACCOUNTS = [
        { user: "mrphuc", pass: "phc51580" },
        { user: "MTP", pass: "MTPVIP" }
    ];

    // ==========================================
    // 2. LOCALSTORAGE HELPERS
    // ==========================================
    function getKeys() {
        const data = localStorage.getItem('vip_keys');
        return data ? JSON.parse(data) : [];
    }
    function saveKeys(keys) {
        localStorage.setItem('vip_keys', JSON.stringify(keys));
    }
    function getLinks() {
        const data = localStorage.getItem('vip_links');
        return data ? JSON.parse(data) : [];
    }
    function saveLinks(links) {
        localStorage.setItem('vip_links', JSON.stringify(links));
    }

    // ==========================================
    // 3. ĐIỀU HƯỚNG TRANG
    // ==========================================
    function hideAll() {
        document.querySelectorAll('.box').forEach(b => b.classList.add('hidden'));
    }
    function showKeyPage() {
        hideAll();
        document.getElementById('pageKey').classList.remove('hidden');
    }
    function showAdminLogin() {
        hideAll();
        document.getElementById('pageAdminLogin').classList.remove('hidden');
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
    }
    function showAdminPanel() {
        hideAll();
        document.getElementById('pageAdminPanel').classList.remove('hidden');
        switchTab('key');
        renderManage();
    }
    function showWelcome() {
        hideAll();
        document.getElementById('pageWelcome').classList.remove('hidden');
        renderWelcomeLinks();
    }

    // ==========================================
    // 4. XỬ LÝ KEY NGƯỜI DÙNG
    // ==========================================
    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.innerText = text;
        el.className = 'msg ' + (type === 'error' ? 'msg-error' : 'msg-success');
        el.style.display = 'block';
    }

    function checkKey() {
        const input = document.getElementById('inputKey').value.trim().toUpperCase();
        const msg = document.getElementById('msgKey');
        
        if (!input) {
            showMsg('msgKey', '❌ Vui lòng nhập Key!', 'error');
            return;
        }

        const keys = getKeys();
        const keyObj = keys.find(k => k.code === input);

        if (!keyObj) {
            showMsg('msgKey', '❌ Key không tồn tại!', 'error');
            return;
        }

        if (keyObj.expires < Date.now()) {
            showMsg('msgKey', '⏰ Key đã hết hạn!', 'error');
            return;
        }

        // Lưu key đang dùng
        localStorage.setItem('vip_active_key', input);
        document.getElementById('activeKey').innerText = input;
        showWelcome();
    }

    function logoutUser() {
        localStorage.removeItem('vip_active_key');
        document.getElementById('inputKey').value = '';
        document.getElementById('msgKey').style.display = 'none';
        showKeyPage();
    }

    // ==========================================
    // 5. XỬ LÝ ADMIN LOGIN
    // ==========================================
    function adminLogin() {
        const user = document.getElementById('adminUser').value.trim();
        const pass = document.getElementById('adminPass').value.trim();

        const found = ADMIN_ACCOUNTS.find(a => a.user === user && a.pass === pass);

        if (!found) {
            showMsg('msgAdminLogin', '❌ Sai tài khoản hoặc mật khẩu!', 'error');
            return;
        }

        localStorage.setItem('vip_admin_user', user);
        showAdminPanel();
    }

    function adminLogout() {
        localStorage.removeItem('vip_admin_user');
        showKeyPage();
    }

    // ==========================================
    // 6. TẠO KEY
    // ==========================================
    function generateKeyCode() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let code = 'VIP-';
        for (let i = 0; i < 12; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    function getDurationMs(duration) {
        const map = {
            '1h': 1 * 60 * 60 * 1000,
            '10h': 10 * 60 * 60 * 1000,
            '1d': 24 * 60 * 60 * 1000,
            '3d': 3 * 24 * 60 * 60 * 1000,
            '7d': 7 * 24 * 60 * 60 * 1000,
            '30d': 30 * 24 * 60 * 60 * 1000,
            '60d': 60 * 24 * 60 * 60 * 1000,
            '365d': 365 * 24 * 60 * 60 * 1000
        };
        return map[duration] || map['1d'];
    }

    function createKey() {
        const duration = document.getElementById('keyDuration').value;
        const keys = getKeys();
        
        const newKey = {
            code: generateKeyCode(),
            duration: duration,
            created: Date.now(),
            expires: Date.now() + getDurationMs(duration)
        };

        keys.push(newKey);
        saveKeys(keys);

        showMsg('msgCreateKey', '✅ Đã tạo Key: ' + newKey.code + ' | Hạn: ' + duration, 'success');
        renderManage();
    }

    // ==========================================
    // 7. QUẢN LÝ LINK
    // ==========================================
    function addLink() {
        const name = document.getElementById('linkName').value.trim();
        const url = document.getElementById('linkUrl').value.trim();

        if (!name || !url) {
            showMsg('msgLink', '❌ Vui lòng nhập đủ tên và URL!', 'error');
            return;
        }
        if (!url.startsWith('http')) {
            showMsg('msgLink', '❌ URL phải bắt đầu bằng http:// hoặc https://', 'error');
            return;
        }

        const links = getLinks();
        links.push({ name: name, url: url, created: Date.now() });
        saveLinks(links);

        document.getElementById('linkName').value = '';
        document.getElementById('linkUrl').value = '';
        showMsg('msgLink', '✅ Đã thêm link thành công!', 'success');
        renderManage();
    }

    // ==========================================
    // 8. RENDER QUẢN LÝ
    // ==========================================
    function renderManage() {
        // Render Keys
        const keyList = document.getElementById('keyList');
        const keys = getKeys();
        if (keys.length === 0) {
            keyList.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">Chưa có Key nào</div>';
        } else {
            keyList.innerHTML = keys.reverse().map(k => {
                const isExpired = k.expires < Date.now();
                const expDate = new Date(k.expires).toLocaleString('vi-VN');
                return `
                    <div class="key-item">
                        <div>
                            <div class="key-code">${k.code}</div>
                            <div class="key-exp">HSD: ${expDate}</div>
                        </div>
                        <div>
                            <span class="key-badge" style="background: ${isExpired ? '#dc2626' : '#22c55e'}">
                                ${isExpired ? 'HẾT HẠN' : 'ACTIVE'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Links
        const linkList = document.getElementById('linkList');
        const links = getLinks();
        if (links.length === 0) {
            linkList.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">Chưa có Link nào</div>';
        } else {
            linkList.innerHTML = links.map((l, i) => `
                <div class="link-item">
                    <a href="${l.url}" target="_blank">${l.name}</a>
                    <button onclick="deleteLink(${i})" style="background:none; border:none; color:#ff6b6b; cursor:pointer; font-size:14px;">❌</button>
                </div>
            `).join('');
        }
    }

    function deleteLink(index) {
        const links = getLinks();
        links.splice(index, 1);
        saveLinks(links);
        renderManage();
    }

    function renderWelcomeLinks() {
        const links = getLinks();
        const container = document.getElementById('welcomeLinks');
        if (links.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:13px; padding:10px;">Chưa có link nào được thêm</div>';
        } else {
            container.innerHTML = '<h2 style="font-size:15px; margin-bottom:10px;">🔗 Link dành cho bạn:</h2>' + 
                links.map(l => `<div class="link-item"><a href="${l.url}" target="_blank">${l.name}</a></div>`).join('');
        }
    }

    // ==========================================
    // 9. TAB SWITCHING
    // ==========================================
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('[id^="tabContent"]').forEach(c => c.classList.add('hidden'));

        if (tab === 'key') {
            document.getElementById('tabKey').classList.add('active');
            document.getElementById('tabContentKey').classList.remove('hidden');
        } else if (tab === 'link') {
            document.getElementById('tabLink').classList.add('active');
            document.getElementById('tabContentLink').classList.remove('hidden');
        } else if (tab === 'manage') {
            document.getElementById('tabManage').classList.add('active');
            document.getElementById('tabContentManage').classList.remove('hidden');
            renderManage();
        }
    }

    // ==========================================
    // 10. XÓA TẤT CẢ
    // ==========================================
    function clearAll() {
        if (confirm('Bạn có chắc chắn muốn xóa TẤT CẢ Key và Link không?')) {
            localStorage.removeItem('vip_keys');
            localStorage.removeItem('vip_links');
            renderManage();
            alert('Đã xóa toàn bộ dữ liệu!');
        }
    }

    // ==========================================
    // 11. KHỞI TẠO
    // ==========================================
    window.onload = function() {
        // Nếu admin đã đăng nhập thì vào thẳng panel
        const adminUser = localStorage.getItem('vip_admin_user');
        if (adminUser) {
            document.getElementById('adminName').innerText = adminUser;
            showAdminPanel();
            return;
        }

        // Nếu user đã nhập key đúng và còn hạn thì vào thẳng
        const activeKey = localStorage.getItem('vip_active_key');
        if (activeKey) {
            const keys = getKeys();
            const keyObj = keys.find(k => k.code === activeKey);
            if (keyObj && keyObj.expires > Date.now()) {
                document.getElementById('activeKey').innerText = activeKey;
                showWelcome();
                return;
            } else {
                localStorage.removeItem('vip_active_key');
            }
        }

        showKeyPage();
    };
</script>

</body>
</html>
