<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEADLOCK MR.PHUC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0a0a0a; color: #fff; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; padding: 15px;
            background-image: radial-gradient(circle at center, #1a0000 0%, #050505 100%);
        }
        .container {
            background: linear-gradient(145deg, #1a0000, #330000);
            border: 1px solid #ff1a1a; border-radius: 20px; padding: 20px 15px;
            width: 100%; max-width: 420px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5), inset 0 0 20px rgba(255, 0, 0, 0.2);
            text-align: center; animation: glowBox 2s infinite alternate;
            position: relative; overflow: hidden;
        }
        @keyframes glowBox {
            from { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
            to { box-shadow: 0 0 40px rgba(255, 0, 0, 0.8); }
        }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .title h1 { font-size: 20px; font-weight: 900; color: #fff; line-height: 1.1; text-align: left; }
        .title h1 span { color: #ff0000; font-size: 22px; }
        .title p { font-size: 8px; color: #ff4d4d; letter-spacing: 2px; text-align: left; margin-top: 2px; }
        .status-box {
            background: rgba(20, 0, 0, 0.8); border: 1px solid #ff3333; border-radius: 10px;
            padding: 6px 10px; display: flex; gap: 10px; font-size: 9px;
        }
        .status-box div { display: flex; flex-direction: column; align-items: center; }
        .status-box .label { color: #ff8080; font-size: 7px; text-transform: uppercase; }
        .status-box .value { color: #fff; font-weight: bold; }
        .online-dot { color: #ff0000; font-size: 9px; margin-right: 2px; }
        
        /* NOTIFICATION BAR */
        .notification-bar {
            display: none; background: #1a0000; border: 1px solid #00cc00; border-radius: 10px;
            padding: 10px; margin-bottom: 15px; text-align: left; font-size: 12px; font-weight: bold;
            color: #66ff66; animation: slideDown 0.3s ease-out; box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .notification-bar svg { width: 16px; height: 16px; fill: #00ff00; vertical-align: middle; margin-right: 5px; }
        
        /* LOGO */
        .logo-area { display: flex; justify-content: center; margin-bottom: 15px; }
        .logo-circle {
            width: 100px; height: 100px; border-radius: 50%; border: 3px solid #ff1a1a;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6), inset 0 0 20px rgba(255, 0, 0, 0.4);
            background: radial-gradient(circle, #330000 0%, #0a0a0a 80%); overflow: hidden;
        }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        /* AUTH SECTION */
        .auth-section { display: flex; flex-direction: column; gap: 12px; }
        .input-label { text-align: left; font-size: 11px; color: #ff4d4d; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .input-row { display: flex; gap: 8px; }
        .custom-input {
            flex: 1; padding: 14px 10px; border-radius: 12px; border: 1px solid #ff3333;
            background-color: #1a0000; color: #fff; font-size: 13px; outline: none; text-align: center;
        }
        .custom-input::placeholder { color: #660000; }
        .btn-paste {
            padding: 0 15px; border-radius: 12px; border: 1px solid #ff4d4d;
            background: linear-gradient(90deg, #660000, #cc0000); color: #fff;
            font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-paste svg { width: 14px; height: 14px; fill: #fff; }
        
        /* BUTTONS */
        .btn-primary {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ff4d4d;
            background: linear-gradient(90deg, #990000, #ff1a1a); color: #fff; font-size: 14px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-primary:active { transform: scale(0.97); }
        
        .btn-outline {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ff3333;
            background: #140000; color: #ffcccc; font-size: 12px; font-weight: bold;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-outline:active { background: #330000; color: #fff; }
        
        .bottom-buttons { display: flex; gap: 10px; margin-top: 5px; }
        .bottom-buttons .btn-outline { flex: 1; }
        
        /* AIM SELECT SECTION */
        .aim-select-section { display: none; flex-direction: column; gap: 10px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .aim-list-container {
            max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            padding-right: 5px;
        }
        .aim-list-container::-webkit-scrollbar { width: 4px; }
        .aim-list-container::-webkit-scrollbar-thumb { background: #ff0000; border-radius: 2px; }
        
        .aim-item {
            display: flex; align-items: center; justify-content: space-between;
            background: #140000; border: 1px solid #ff3333; border-radius: 10px;
            padding: 12px 15px; cursor: pointer; transition: 0.3s; text-align: left;
        }
        .aim-item:active { background: #330000; }
        .aim-item.selected {
            border-color: #ff1a1a; background: linear-gradient(90deg, #330000, #1a0000);
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        .aim-item-left { display: flex; align-items: center; gap: 10px; }
        .aim-item-icon {
            width: 24px; height: 24px; border-radius: 50%; border: 1px solid #ff4d4d;
            display: flex; justify-content: center; align-items: center; background: #260000;
        }
        .aim-item-icon svg { width: 14px; height: 14px; fill: #ff4d4d; }
        .aim-item-text h3 { font-size: 13px; color: #fff; font-weight: bold; }
        .aim-item-text p { font-size: 10px; color: #ff8080; }
        .aim-item-radio {
            width: 18px; height: 18px; border-radius: 50%; border: 2px solid #ff4d4d;
            display: flex; justify-content: center; align-items: center;
        }
        .aim-item.selected .aim-item-radio { border-color: #ff0000; background: #ff0000; }
        .aim-item.selected .aim-item-radio::after {
            content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff;
        }
        
        /* TOOL SECTION */
        .tool-section { display: none; flex-direction: column; gap: 12px; animation: fadeIn 0.5s; }
        
        .info-row { display: flex; gap: 10px; }
        .info-box {
            flex: 1; background: #140000; border: 1px solid #ff3333; border-radius: 10px;
            padding: 10px; display: flex; justify-content: center; align-items: center; gap: 8px;
            font-family: 'Courier New', monospace; font-size: 13px; color: #ffcccc;
        }
        .info-box svg { width: 14px; height: 14px; fill: #ff1a1a; }
        
        .toggle-container {
            background: #140000; border: 1px solid #ff3333; border-radius: 12px;
            padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .toggle-left { display: flex; align-items: center; gap: 10px; text-align: left; }
        .toggle-icon {
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid #ff1a1a;
            display: flex; justify-content: center; align-items: center; background: #330000;
        }
        .toggle-icon svg { width: 18px; height: 18px; fill: #ff1a1a; }
        .toggle-text .label { font-size: 9px; color: #ff8080; text-transform: uppercase; font-weight: bold; }
        .toggle-text .value { font-size: 13px; color: #fff; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: not-allowed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #660000; transition: .4s; border-radius: 34px; border: 1px solid #ff3333;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: #ff1a1a; transition: .4s; border-radius: 50%;
        }
        .switch input:disabled + .slider:before { background-color: #fff; transform: translateX(22px); }
        
        .server-info {
            background: #140000; border: 1px solid #ff3333; border-radius: 10px;
            padding: 12px; text-align: left; font-family: 'Courier New', monospace; font-size: 12px;
        }
        .server-info .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .server-info .row:last-child { margin-bottom: 0; }
        .server-info .label { color: #ff4d4d; }
        .server-info .value { color: #fff; }
        
        .btn-stop {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ff4d4d;
            background: linear-gradient(90deg, #990000, #ff1a1a); color: #fff; font-size: 14px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; margin-top: 5px;
        }
        .btn-stop:active { transform: scale(0.97); }
        
        /* ADMIN PANEL */
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .admin-box { background: #1a0000; border: 2px solid #ff0000; border-radius: 15px; padding: 25px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 30px #ff0000; }
        .admin-box h2 { color: #ff3333; margin-bottom: 20px; text-transform: uppercase; font-size: 18px; }
        .admin-box input, .admin-box select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ff4d4d; background: #260000; color: #fff; text-align: center; }
        .admin-box button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; background: #ff1a1a; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .admin-box button:active { transform: scale(0.97); }
        .key-display { background: #003300; border: 1px solid #00cc00; padding: 15px; border-radius: 8px; margin-top: 10px; font-family: monospace; font-size: 16px; color: #00ff00; word-break: break-all; display: none; cursor: pointer; }
        .key-list { max-height: 150px; overflow-y: auto; text-align: left; font-size: 11px; margin-top: 15px; border-top: 1px solid #ff3333; padding-top: 10px; }
        .key-list div { color: #ffcccc; margin-bottom: 5px; border-bottom: 1px dashed #330000; padding-bottom: 3px; font-family: monospace; }
        .admin-link { margin-top: 15px; color: #ff1a1a; font-size: 11px; cursor: pointer; text-decoration: underline; display: inline-block; font-weight: bold; text-transform: uppercase; }
        .error-msg { color: #ff4d4d; font-size: 12px; text-align: center; display: none; font-weight: bold; margin-top: 5px; }
        .success-msg { color: #00ff00; font-size: 12px; text-align: center; display: none; font-weight: bold; margin-top: 5px; }
    </style>
</head>

                    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor;"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    CERT
                </button>
            </div>
        </div>

        <div class="footer">
            &lt;/&gt; BY <span>ZENITH SOLITUDE</span><br>
            <span class="admin-link" onclick="toggleAdminPanel()">⚙️ QUẢN TRỊ VIÊN</span>
        </div>
    </div>

    <script>
        const ADMIN_USER = "admin"; const ADMIN_PASS = "phc51580";
        const SECRET = "PHUC_SECRET_2024_X9K2"; 
        const REF_TIME = new Date('2024-01-01T00:00:00Z').getTime();
        const HOUR_MS = 3600 * 1000; const TOTAL_HOURS = 46656;
        let countdownInterval = null;
        let currentAim = null;
        let currentPort = "2928";
        let currentAimName = "";

        // DANH SÁCH AIM (Ảnh 1 + 2 loại mới)
        const aims = [
            { id: "silent", name: "Aim Silent", desc: "Log thẳng no dns", port: "2928" },
            { id: "body70", name: "Aim Body 70%", desc: "Aim Body 70%", port: "2081" },
            { id: "body70_ant", name: "Aim Body 70% Antenna", desc: "Aim Body 70% Antenna", port: "2081" },
            { id: "head_only", name: "Aim Head Only", desc: "Log thẳng no dns", port: "2928" },
            { id: "head_esp", name: "Aim Head Esp Only", desc: "Log thẳng no dns", port: "2928" },
            { id: "neck", name: "Aim Neck", desc: "Log thẳng no dns", port: "2928" },
            { id: "magic_bullet", name: "Aim MagicBullet Antenna", desc: "Aim MagicBullet Antenna", port: "2928" },
            { id: "headshot", name: "Aim Headshot", desc: "Tự động bắn đầu", port: "2928" }, // Mới thêm
            { id: "dragon", name: "Aim Dragon", desc: "Log thẳng no dns", port: "2081" } // Mới thêm
        ];

        function simpleHash(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) + hash) + str.charCodeAt(i); hash = hash >>> 0; }
            return hash.toString(36).toUpperCase();
        }
        const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        function randomChar() { return CHARS[Math.floor(Math.random() * CHARS.length)]; }

        function createKey(durationDays) {
            let durationLabel = (durationDays === 0) ? "VVD" : (durationDays === 0.5) ? "12H" : String(durationDays).padStart(2, '0') + "D";
            const hours = Math.floor((Date.now() - REF_TIME) / HOUR_MS) % TOTAL_HOURS;
            const hoursPart = hours.toString(36).toUpperCase().padStart(3, '0');
            const randomPart = randomChar() + randomChar();
            const checksum = simpleHash(durationLabel + hoursPart + randomPart + SECRET).slice(-1);
            return `PHUC-${durationLabel}-${hoursPart}${randomPart}${checksum}`;
        }

        function parseKey(key) {
            key = key.trim().toUpperCase().replace(/[–—−]/g, '-');
            const parts = key.split('-');
            if (parts.length !== 3 || parts[0] !== 'PHUC') return null;
            const durationLabel = parts[1], code = parts[2];
            if (durationLabel.length !== 3 || code.length !== 6) return null;
            
            let durationDays;
            if (durationLabel === "VVD") durationDays = 0;
            else if (durationLabel === "12H") durationDays = 0.5;
            else {
                durationDays = parseInt(durationLabel.slice(0, 2));
                if (isNaN(durationDays) || durationDays <= 0 || durationLabel[2] !== 'D') return null;
            }
            const hoursPart = code.slice(0, 3), randomPart = code.slice(3, 5), givenChecksum = code.slice(5, 6);
            if (givenChecksum !== simpleHash(durationLabel + hoursPart + randomPart + SECRET).slice(-1)) return null;
            
            const hours = parseInt(hoursPart, 36);
            if (isNaN(hours) || hours >= TOTAL_HOURS) return null;
            const createdAt = REF_TIME + hours * HOUR_MS;
            let expiresAt = (durationDays === 0) ? 9999999999999 : createdAt + durationDays * 24 * 60 * 60 * 1000;
            return { durationDays, createdAt, expiresAt };
        }

        function pasteKey() {
            const inputField = document.getElementById('licenseInput');
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(text => {
                    if (text && text.trim() !== '') {
                        inputField.value = text.trim().replace(/[–—−]/g, '-').toUpperCase();
                        showNotification("Đã dán Key!");
                    } else {
                        showNotification("Bộ nhớ tạm trống!");
                    }
                }).catch(() => showNotification("Nhấn giữ ô nhập và chọn Dán"));
            } else {
                showNotification("Nhấn giữ ô nhập và chọn Dán");
            }
        }

        function showNotification(msg) {
            const notif = document.getElementById('notificationBar');
            const text = document.getElementById('notificationText');
            text.textContent = msg;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        function activateKey() {
            const input = document.getElementById('licenseInput').value.trim();
            const errorMsg = document.getElementById('errorMsg'), successMsg = document.getElementById('successMsg');
            errorMsg.style.display = "none"; successMsg.style.display = "none";

            if (input === "") { errorMsg.textContent = "Vui lòng nhập Key!"; errorMsg.style.display = "block"; return; }
            const parsed = parseKey(input);
            if (!parsed) { errorMsg.textContent = "Key không hợp lệ!"; errorMsg.style.display = "block"; return; }
            if (parsed.durationDays !== 0 && Date.now() >= parsed.expiresAt) { errorMsg.textContent = "Key đã hết hạn!"; errorMsg.style.display = "block"; return; }

            localStorage.setItem('ff_active_key', JSON.stringify({ key: input, expiresAt: parsed.expiresAt, isLifetime: parsed.durationDays === 0 }));
            successMsg.textContent = `Kích hoạt thành công!`; successMsg.style.display = "block";
            
            setTimeout(() => {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('aimSelectSection').style.display = 'flex';
                renderAimList();
            }, 800);
        }

        // HÀM RENDER DANH SÁCH AIM
        function renderAimList() {
            const container = document.getElementById('aimListContainer');
            container.innerHTML = '';
            aims.forEach((aim, index) => {
                const div = document.createElement('div');
                div.className = 'aim-item' + (currentAim === aim.id ? ' selected' : '');
                div.onclick = () => selectAim(aim.id);
                div.innerHTML = `
                    <div class="aim-item-left">
                        <div class="aim-item-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-13c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3z"/></svg></div>
                        <div class="aim-item-text">
                            <h3>${aim.name}</h3>
                            <p>${aim.desc}</p>
                        </div>
                    </div>
                    <div class="aim-item-radio"></div>
                `;
                container.appendChild(div);
            });
        }

        function selectAim(id) {
            currentAim = id;
            const aimData = aims.find(a => a.id === id);
            currentAimName = aimData.name;
            currentPort = aimData.port;
            renderAimList();
        }

        // HÀM KÍCH HOẠT AIM ĐÃ CHỌN (Ảnh 2, 3, 4)
        function activateSelectedAim() {
            if (!currentAim) {
                showNotification("Vui lòng chọn 1 Aim trước!");
                return;
            }
            
            document.getElementById('aimSelectSection').style.display = 'none';
            document.getElementById('toolSection').style.display = 'flex';
            document.getElementById('activeAimName').textContent = currentAimName;
            document.getElementById('activePort').textContent = currentPort;
            
            showNotification(`Kích hoạt ${currentAimName} thành công!`);
            
            // Lấy thời gian còn lại từ localStorage
            const activeKeyData = JSON.parse(localStorage.getItem('ff_active_key'));
            if (activeKeyData) {
                startCountdown(activeKeyData.expiresAt);
            }
        }

        // HÀM TẮT AIM (Ảnh 5)
        function deactivateAim() {
            if (countdownInterval) clearInterval(countdownInterval);
            document.getElementById('toolSection').style.display = 'none';
            document.getElementById('aimSelectSection').style.display = 'flex';
            
            showNotification("Đã tắt aim. Chờ 5s để kích hoạt aim khác.");
        }

        function startCountdown(expiresAt) {
            if (countdownInterval) clearInterval(countdownInterval);
            const display = document.getElementById('countdown');
            function updateTimer() {
                const remaining = expiresAt - Date.now();
                if (remaining <= 0) { clearInterval(countdownInterval); display.textContent = "00:00:00"; alert("Key đã hết hạn!"); deactivateAim(); return; }
                const totalSec = Math.floor(remaining / 1000);
                const hours = Math.floor((totalSec % 86400) / 3600), minutes = Math.floor((totalSec % 3600) / 60), seconds = totalSec % 60;
                display.textContent = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            }
            updateTimer(); countdownInterval = setInterval(updateTimer, 1000);
        }

        // NÚT CERT (Ảnh 5)
        function showCert() {
            // Thay link này bằng link cert thực tế của bạn
            window.location.href = "https://solitudepremium.click";
        }

        function showGetKey() {
            window.location.href = "https://zalo.me/0865561731";
        }

        // ADMIN LOGIC
        function toggleAdminPanel() { const panel = document.getElementById('adminPanel'); panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex'; }
        function loginAdmin() {
            const user = document.getElementById('adminUser').value, pass = document.getElementById('adminPass').value, msg = document.getElementById('adminMsg');
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById('adminLoginForm').style.display = 'none'; document.getElementById('adminControlPanel').style.display = 'block'; msg.textContent = ""; renderAdminKeyList();
            } else msg.textContent = "Sai tài khoản hoặc mật khẩu!";
        }
        function logoutAdmin() { document.getElementById('adminLoginForm').style.display = 'block'; document.getElementById('adminControlPanel').style.display = 'none'; document.getElementById('adminUser').value = ''; document.getElementById('adminPass').value = ''; document.getElementById('keyDisplay').style.display = 'none'; }
        function generateAdminKey() {
            const duration = parseFloat(document.getElementById('durationSelect').value);
            const newKey = createKey(duration);
            let adminKeys = JSON.parse(localStorage.getItem('ff_admin_keys') || '[]');
            adminKeys.unshift({ key: newKey, duration: duration, createdAt: Date.now() });
            if (adminKeys.length > 100) adminKeys = adminKeys.slice(0, 100);
            localStorage.setItem('ff_admin_keys', JSON.stringify(adminKeys));
            const display = document.getElementById('keyDisplay');
            display.innerHTML = newKey + '<span class="hint">👆 Bấm để copy lại</span>';
            display.style.display = 'block'; autoCopy(newKey, display); renderAdminKeyList();
        }
        function autoCopy(text, displayEl) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => { displayEl.classList.add('copied'); setTimeout(() => displayEl.classList.remove('copied'), 1500); }).catch(() => {});
            } else { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e) {} document.body.removeChild(ta); }
        }
        function copyDisplayedKey() { const text = document.getElementById('keyDisplay').innerText; if (!text) return; const cleanText = text.split('\n')[0].trim(); autoCopy(cleanText, document.getElementById('keyDisplay')); }
        function renderAdminKeyList() {
            const list = document.getElementById('generatedKeyList'); let adminKeys = JSON.parse(localStorage.getItem('ff_admin_keys') || '[]');
            if (adminKeys.length === 0) { list.innerHTML = '<div style="color:#ff8080; text-align:center; padding:5px;">Chưa có key nào được tạo.</div>'; return; }
            list.innerHTML = '';
            adminKeys.forEach(item => {
                const div = document.createElement('div'); const date = new Date(item.createdAt);
                const dateStr = date.toLocaleDateString('vi-VN') + ' ' + date.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
                let durationText; if (item.duration === 0) durationText = "Vĩnh viễn"; else if (item.duration === 0.5) durationText = "12 giờ"; else durationText = item.duration + " ngày";
                div.innerHTML = `${item.key}<br><span style="color:#ff6666; font-size:10px;">Tạo: ${dateStr} (${durationText})</span>`; list.appendChild(div);
            });
        }

        window.addEventListener('load', () => {
            const activeKeyData = JSON.parse(localStorage.getItem('ff_active_key'));
            if (activeKeyData && activeKeyData.expiresAt > Date.now()) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('aimSelectSection').style.display = 'flex';
                renderAimList();
            } else {
                localStorage.removeItem('ff_active_key');
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('aimSelectSection').style.display = 'none';
                document.getElementById('toolSection').style.display = 'none';
            }
        });
    </script>
