    <script>
        // ==========================================
        // CẤU HÌNH
        // ==========================================
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "phc51580";
        const SECRET_KEY = "PHC51580_SECRET_KEY_2024_XYZ"; 
        
        let countdownInterval = null;

        // ==========================================
        // MÃ HÓA & TẠO KEY
        // ==========================================
        
        function simpleHash(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
                hash = hash >>> 0;
            }
            return hash.toString(36).toUpperCase().padStart(6, '0').slice(0, 6);
        }

        function createKey(durationDays) {
            const timestamp = Date.now();
            const tsBase36 = timestamp.toString(36).toUpperCase();
            const durationPart = durationDays + "D";
            const data = durationPart + tsBase36;
            const sig = simpleHash(data + SECRET_KEY);
            return `PHC-${durationPart}-${tsBase36}-${sig}`;
        }

        function parseKey(key) {
            key = key.trim().toUpperCase();
            const parts = key.split('-');
            if (parts.length !== 4 || parts[0] !== 'PHC') return null;
            
            const durationPart = parts[1];
            const tsBase36 = parts[2];
            const sig = parts[3];
            
            const durationDays = parseInt(durationPart);
            if (isNaN(durationDays) || durationDays <= 0) return null;
            
            const timestamp = parseInt(tsBase36, 36);
            if (isNaN(timestamp)) return null;
            
            const expectedSig = simpleHash(durationPart + tsBase36 + SECRET_KEY);
            if (sig !== expectedSig) return null;
            
            const expiresAt = timestamp + (durationDays * 24 * 60 * 60 * 1000);
            
            return { durationDays, createdAt: timestamp, expiresAt };
        }

        // ==========================================
        // LOGIC NGƯỜI DÙNG
        // ==========================================
        
        function activateKey() {
            const input = document.getElementById('licenseInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            if (input === "") {
                errorMsg.textContent = "Vui lòng nhập Key để kích hoạt!";
                errorMsg.style.display = "block";
                return;
            }

            const parsed = parseKey(input);
            
            if (!parsed) {
                errorMsg.textContent = "Key không hợp lệ! Vui lòng kiểm tra lại.";
                errorMsg.style.display = "block";
                return;
            }

            if (Date.now() >= parsed.expiresAt) {
                errorMsg.textContent = "Key này đã hết hạn! Vui lòng liên hệ Admin để gia hạn.";
                errorMsg.style.display = "block";
                return;
            }

            localStorage.setItem('ff_active_key', JSON.stringify({ 
                key: input, 
                expiresAt: parsed.expiresAt 
            }));

            successMsg.textContent = `Kích hoạt thành công!`;
            successMsg.style.display = "block";
            
            setTimeout(() => {
                showToolScreen(parsed.expiresAt);
            }, 800);
        }

        function showToolScreen(expiresAt) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('toolSection').style.display = 'flex';
            startCountdown(expiresAt);
        }

        function startCountdown(expiresAt) {
            if (countdownInterval) clearInterval(countdownInterval);
            const display = document.getElementById('countdown');
            
            function updateTimer() {
                const now = Date.now();
                let remaining = expiresAt - now;
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    display.textContent = "00:00:00";
                    alert("Key đã hết hạn! Vui lòng liên hệ Admin để gia hạn.");
                    deactivateTool();
                    return;
                }
                
                const totalSec = Math.floor(remaining / 1000);
                const days = Math.floor(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;
                
                let timeStr = "";
                if (days > 0) timeStr += days + "n ";
                timeStr += String(hours).padStart(2, '0') + ':' + 
                           String(minutes).padStart(2, '0') + ':' + 
                           String(seconds).padStart(2, '0');
                           
                display.textContent = timeStr;
            }
            
            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }

        function deactivateTool() {
            if (countdownInterval) clearInterval(countdownInterval);
            localStorage.removeItem('ff_active_key');
            document.getElementById('toolSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'flex';
            document.getElementById('licenseInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }

        document.getElementById('licenseInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') activateKey();
        });

        // ==========================================
        // LOGIC ADMIN
        // ==========================================
        
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'flex') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'flex';
            }
        }

        function loginAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            const msg = document.getElementById('adminMsg');
            
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById('adminLoginForm').style.display = 'none';
                document.getElementById('adminControlPanel').style.display = 'block';
                msg.textContent = "";
                renderAdminKeyList();
            } else {
                msg.textContent = "Sai tên đăng nhập hoặc mật khẩu!";
            }
        }

        function logoutAdmin() {
            document.getElementById('adminLoginForm').style.display = 'block';
            document.getElementById('adminControlPanel').style.display = 'none';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('keyDisplay').style.display = 'none';
        }

        function generateAdminKey() {
            const duration = parseInt(document.getElementById('durationSelect').value);
            const newKey = createKey(duration);
            
            let adminKeys = JSON.parse(localStorage.getItem('ff_admin_keys') || '[]');
            adminKeys.unshift({ key: newKey, duration: duration, createdAt: Date.now() });
            if (adminKeys.length > 100) adminKeys = adminKeys.slice(0, 100);
            localStorage.setItem('ff_admin_keys', JSON.stringify(adminKeys));
            
            const display = document.getElementById('keyDisplay');
            display.textContent = newKey;
            display.style.display = 'block';
            
            renderAdminKeyList();
        }

        function renderAdminKeyList() {
            const list = document.getElementById('generatedKeyList');
            let adminKeys = JSON.parse(localStorage.getItem('ff_admin_keys') || '[]');
            
            if (adminKeys.length === 0) {
                list.innerHTML = '<div style="color:#ff8080; text-align:center; padding:5px;">Chưa có key nào được tạo.</div>';
                return;
            }
            
            list.innerHTML = '';
            adminKeys.forEach(item => {
                const div = document.createElement('div');
                const date = new Date(item.createdAt);
                const dateStr = date.toLocaleDateString('vi-VN') + ' ' + date.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
                div.innerHTML = `${item.key}<br><span style="color:#ff6666; font-size:10px;">Tạo: ${dateStr} (${item.duration} ngày)</span>`;
                list.appendChild(div);
            });
        }

        // KHỞI ĐỘNG
        window.addEventListener('load', () => {
            const activeKeyData = JSON.parse(localStorage.getItem('ff_active_key'));
            
            if (activeKeyData && activeKeyData.expiresAt > Date.now()) {
                showToolScreen(activeKeyData.expiresAt);
            } else {
                localStorage.removeItem('ff_active_key');
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('toolSection').style.display = 'none';
            }
        });
    </script>

</body>
</html>
