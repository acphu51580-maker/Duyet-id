        // ==========================================
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "phc51580";
        const SECRET = "PHUC_SECRET_2024_X9K2"; 
        
        const REF_TIME = new Date('2024-01-01T00:00:00Z').getTime();
        const HOUR_MS = 3600 * 1000;
        const TOTAL_HOURS = 46656;
        
        let countdownInterval = null;

        function simpleHash(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
                hash = hash >>> 0;
            }
            return hash.toString(36).toUpperCase();
        }

        const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        function randomChar() {
            return CHARS[Math.floor(Math.random() * CHARS.length)];
        }

        function createKey(durationDays) {
            let durationLabel;
            if (durationDays === 0) durationLabel = "VVD";
            else if (durationDays === 0.5) durationLabel = "12H";
            else durationLabel = String(durationDays).padStart(2, '0') + "D";

            const hours = Math.floor((Date.now() - REF_TIME) / HOUR_MS) % TOTAL_HOURS;
            const hoursPart = hours.toString(36).toUpperCase().padStart(3, '0');
            const randomPart = randomChar() + randomChar();
            const checksum = simpleHash(durationLabel + hoursPart + randomPart + SECRET).slice(-1);
            return `PHUC-${durationLabel}-${hoursPart}${randomPart}${checksum}`;
        }

        function parseKey(key) {
            key = key.trim().toUpperCase();
            key = key.replace(/[–—−]/g, '-');
            
            const parts = key.split('-');
            if (parts.length !== 3 || parts[0] !== 'PHUC') return null;
            
            const durationLabel = parts[1];
            const code = parts[2];
            
            if (durationLabel.length !== 3) return null;
            if (code.length !== 6) return null;
            
            let durationDays;
            if (durationLabel === "VVD") durationDays = 0;
            else if (durationLabel === "12H") durationDays = 0.5;
            else {
                durationDays = parseInt(durationLabel.slice(0, 2));
                if (isNaN(durationDays) || durationDays <= 0 || durationLabel[2] !== 'D') return null;
            }
            
            const hoursPart = code.slice(0, 3);
            const randomPart = code.slice(3, 5);
            const givenChecksum = code.slice(5, 6);
            
            const expectedChecksum = simpleHash(durationLabel + hoursPart + randomPart + SECRET).slice(-1);
            if (givenChecksum !== expectedChecksum) return null;
            
            const hours = parseInt(hoursPart, 36);
            if (isNaN(hours) || hours >= TOTAL_HOURS) return null;
            
            const createdAt = REF_TIME + hours * HOUR_MS;
            
            let expiresAt;
            if (durationDays === 0) expiresAt = 9999999999999;
            else expiresAt = createdAt + durationDays * 24 * 60 * 60 * 1000;
            
            return { durationDays, createdAt, expiresAt };
        }

        function pasteKey() {
            const inputField = document.getElementById('licenseInput');
            const infoMsg = document.getElementById('infoMsg');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            infoMsg.style.display = 'none';
            
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(text => {
                    if (text && text.trim() !== '') {
                        let cleaned = text.trim().replace(/[–—−]/g, '-');
                        inputField.value = cleaned.toUpperCase();
                        infoMsg.textContent = "✅ Đã dán Key từ bộ nhớ tạm!";
                        infoMsg.style.display = 'block';
                        setTimeout(() => { infoMsg.style.display = 'none'; }, 2000);
                    } else {
                        infoMsg.textContent = "⚠️ Bộ nhớ tạm trống, hãy copy Key trước!";
                        infoMsg.style.display = 'block';
                        setTimeout(() => { infoMsg.style.display = 'none'; }, 2500);
                    }
                }).catch(err => fallbackPaste(inputField, infoMsg));
            } else fallbackPaste(inputField, infoMsg);
        }
        
        function fallbackPaste(inputField, infoMsg) {
            infoMsg.textContent = "👉 Hãy nhấn giữ vào ô nhập liệu và chọn 'Dán' (Paste)";
            infoMsg.style.display = 'block';
            setTimeout(() => { infoMsg.style.display = 'none'; }, 3000);
            inputField.focus();
        }

        function activateKey() {
            const input = document.getElementById('licenseInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const infoMsg = document.getElementById('infoMsg');
            
            errorMsg.style.display = "none";
            successMsg.style.display = "none";
            infoMsg.style.display = "none";

            if (input === "") {
                errorMsg.textContent = "Vui lòng nhập Key để kích hoạt!";
                errorMsg.style.display = "block";
                return;
            }

            const parsed = parseKey(input);
            
            if (!parsed) {
                errorMsg.textContent = "Key không hợp lệ! Vui lòng kiểm tra lại.";
                errorMsg.style.display = "block";
                return;
            }

            if (parsed.durationDays !== 0 && Date.now() >= parsed.expiresAt) {
                errorMsg.textContent = "Key này đã hết hạn! Vui lòng liên hệ Admin để gia hạn.";
                errorMsg.style.display = "block";
                return;
            }

            localStorage.setItem('ff_active_key', JSON.stringify({ 
                key: input, expiresAt: parsed.expiresAt,
                isLifetime: parsed.durationDays === 0
            }));

            successMsg.textContent = `Kích hoạt thành công!`;
            successMsg.style.display = "block";
            
            setTimeout(() => showToolScreen(parsed.expiresAt, parsed.durationDays === 0), 800);
        }

        function showToolScreen(expiresAt, isLifetime) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('toolSection').style.display = 'flex';
            
            const display = document.getElementById('countdown');
            if (isLifetime) {
                display.textContent = "VĨNH VIỄN";
                display.style.fontSize = "20px";
                display.style.color = "#00ff00";
                display.style.textShadow = "0 0 10px #00ff00";
                if (countdownInterval) clearInterval(countdownInterval);
            } else {
                display.style.fontSize = "14px";
                display.style.color = "#ffcccc";
                display.style.textShadow = "none";
                startCountdown(expiresAt);
            }
        }

        function startCountdown(expiresAt) {
            if (countdownInterval) clearInterval(countdownInterval);
            const display = document.getElementById('countdown');
            
            function updateTimer() {
                const remaining = expiresAt - Date.now();
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    display.textContent = "00:00:00";
                    alert("Key đã hết hạn! Vui lòng liên hệ Admin để gia hạn.");
                    deactivateTool();
                    return;
                }
                
                const totalSec = Math.floor(remaining / 1000);
                const days = Math.floor(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;
                
                let timeStr = "";
                if (days > 0) timeStr += days + "n ";
                timeStr += String(hours).padStart(2, '0') + ':' + 
                           String(minutes).padStart(2, '0') + ':' + 
                           String(seconds).padStart(2, '0');
                display.textContent = timeStr;
            }
            
            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }

        function deactivateTool() {
            if (countdownInterval) clearInterval(countdownInterval);
            localStorage.removeItem('ff_active_key');
            document.getElementById('toolSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'flex';
            document.getElementById('licenseInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('infoMsg').style.display = 'none';
        }

        document.getElementById('licenseInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') activateKey();
        });

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
        }

        function loginAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            const msg = document.getElementById('adminMsg');
            
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById('adminLoginForm').style.display = 'none';
                document.getElementById('adminControlPanel').style.display = 'block';
                msg.textContent = "";
                renderAdminKeyList();
            } else msg.textContent = "Sai tên đăng nhập hoặc mật khẩu!";
        }

        function logoutAdmin() {
            document.getElementById('adminLoginForm').style.display = 'block';
            document.getElementById('adminControlPanel').style.display = 'none';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('keyDisplay').style.display = 'none';
        }

        function generateAdminKey() {
            const duration = parseFloat(document.getElementById('durationSelect').value);
            const newKey = createKey(duration);
            
            let adminKeys = JSON.parse(localStorage.getItem('ff_admin_keys') || '[]');
            adminKeys.unshift({ key: newKey, duration: duration, createdAt: Date.now() });
            if (adminKeys.length > 100) adminKeys = adminKeys.slice(0, 100);
            localStorage.setItem('ff_admin_keys', JSON.stringify(adminKeys));
            
            const display = document.getElementById('keyDisplay');
            display.innerHTML = newKey + '<span class="hint">👆 Bấm vào đây để copy lại</span>';
            display.style.display = 'block';
            
            autoCopy(newKey, display);
            renderAdminKeyList();
        }
        
        function autoCopy(text, displayEl) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    displayEl.classList.add('copied');
                    setTimeout(() => displayEl.classList.remove('copied'), 1500);
                }).catch(() => {});
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch(e) {}
                document.body.removeChild(ta);
            }
        }
        
        function copyDisplayedKey() {
            const text = document.getElementById('keyDisplay').innerText;
            if (!text) return;
            const cleanText = text.split('\n')[0].trim();
            autoCopy(cleanText, document.getElementById('keyDisplay'));
        }

        function renderAdminKeyList() {
            const list = document.getElementById('generatedKeyList');
            let adminKeys = JSON.parse(localStorage.getItem('ff_admin_keys') || '[]');
            
            if (adminKeys.length === 0) {
                list.innerHTML = '<div style="color:#ff8080; text-align:center; padding:5px;">Chưa có key nào được tạo.</div>';
                return;
            }
            
            list.innerHTML = '';
            adminKeys.forEach(item => {
                const div = document.createElement('div');
                const date = new Date(item.createdAt);
                const dateStr = date.toLocaleDateString('vi-VN') + ' ' + date.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
                
                let durationText;
                if (item.duration === 0) durationText = "Vĩnh viễn";
                else if (item.duration === 0.5) durationText = "12 giờ";
                else durationText = item.duration + " ngày";
                
                div.innerHTML = `${item.key}<br><span style="color:#ff6666; font-size:10px;">Tạo: ${dateStr} (${durationText})</span>`;
                list.appendChild(div);
            });
        }

        window.addEventListener('load', () => {
            const activeKeyData = JSON.parse(localStorage.getItem('ff_active_key'));
            
            if (activeKeyData && activeKeyData.expiresAt > Date.now()) {
                showToolScreen(activeKeyData.expiresAt, activeKeyData.isLifetime);
            } else {
                localStorage.removeItem('ff_active_key');
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('toolSection').style.display = 'none';
            }
        });
    </script>

</body>
